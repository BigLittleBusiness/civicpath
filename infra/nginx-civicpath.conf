# Manual reference only. Do not copy this file directly into a production server.
# Use ./infra/configure-binarylane-nginx-ssl.sh after DNS resolves; it installs
# the reviewed HTTP ACME listener, TLS server block, security headers and renewal check.
server {
    listen 80;
    server_name app.civicpath.com.au;

    root /var/www/civicpath/frontend/build;
    index index.html;
    client_max_body_size 10m;

    location /v1/ {
        proxy_pass http://127.0.0.1:3015/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Add the HTTPS server block only after the DNS A record resolves and a valid
# certificate has been issued. Production must redirect HTTP to HTTPS, set
# HSTS after verification, and use a production `.env` with HTTPS-only cookies.
